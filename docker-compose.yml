services:
  postgres:
    image: postgres:16
    container_name: api_ts_postgres
    restart: always
    ports:
      - "${DB_PORT}:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api: 
    build: .
    container_name: api_ts_app
    restart: always
    ports: 
      - "${PORT}:3000"
    env_file:
      - .env.docker
    depends_on:
      - postgres
  
volumes:
  postgres_data: