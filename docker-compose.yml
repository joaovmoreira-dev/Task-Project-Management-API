version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: api_ts_postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: api_ts_db
    volumes:
      - postgres_data:/var/lib/postgres/data

volumes:
  postgres_data:

